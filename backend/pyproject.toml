[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "ccxt>=4.4",
  "pyyaml>=6",
  "keyring>=25",
  "pandas>=3.1.0",
  "numpy>=2.4.6",
  "anthropic>=2.2.0",
  "pyarrow>=26.0.0",
  "faster-whisper>=1.2.1",
  "openwakeword>=0.6.0",
  "kokoro-onnx>=0.6.1",
  "sounddevice>=0.5.6",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
