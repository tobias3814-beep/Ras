<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ras</title>
    <script>try {
      // the bot-console redesign: switch to Graphite once; any theme picked in Settings afterwards sticks
      if (localStorage.getItem("ras.ui") !== "2") { localStorage.setItem("ras.theme", "graphite"); localStorage.setItem("ras.ui", "2"); }
      document.documentElement.dataset.theme = localStorage.getItem("ras.theme") || "graphite";
    } catch (e) { document.documentElement.dataset.theme = "graphite"; }</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
