# Builds the Windows installer (Ras_x.y.z_x64-setup.exe) on GitHub's Windows machines.
# Run it from the Actions tab ("Run workflow") or by pushing to main. The installer is attached to the run as "Ras-windows-setup".
name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Backend tests (on Windows)
        working-directory: backend
        run: |
          uv sync --python 3.11
          uv run pytest -q
        continue-on-error: true
      - name: Freeze the Python backend
        working-directory: backend
        run: |
          uv sync --python 3.11
          uv run pyinstaller jarvis-backend.spec --noconfirm --log-level WARN
      - name: Backend starts
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\ras-home"
          $p = Start-Process backend\dist\jarvis-backend\jarvis-backend.exe -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..90) { Start-Sleep 2; try { if ((Invoke-WebRequest http://127.0.0.1:18765/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch {} }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\ras-home\logs\*.log" -Tail 60 -ErrorAction SilentlyContinue; throw "backend did not answer /health" }
          Write-Host "backend answered /health"
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Ras-windows-setup
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
